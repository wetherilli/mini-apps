<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앱 이름</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#17171a; --dim:#6b6b73; --line:#e3e3e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e0e11; --fg:#ececf0; --dim:#9a9aa4; --line:#26262c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px 16px; background:var(--bg); color:var(--fg);
         font:16px/1.65 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width: 560px; margin:0 auto; }
  h1 { margin:0 0 20px; font-size:1.5rem; }
  a.back { display:inline-block; margin-bottom:24px; color:var(--dim); font-size:.9rem; }
  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px;
           background:transparent; color:inherit; cursor:pointer; }
  .ver { margin-top:28px; color:var(--dim); font-size:.8rem; }
</style>

<main>
  <a class="back" href="../../">← 목록</a>
  <h1>앱 이름</h1>

  <p id="out">여기에 결과를 띄웁니다.</p>
  <button id="go">눌러 보기</button>

  <p class="ver">판 <span id="ver">—</span></p>
</main>

<!-- ?v= 는 캐시 갈이입니다 — 고친 뒤 `node tools/판올리기.js <앱이름>` 이 올려 줍니다.
     손으로 고치지 마십시오(app.js 의 VERSION 과 어긋납니다). -->
<script src="app.js?v=1.0.0"></script>
