<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini-apps</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#17171a; --dim:#6b6b73; --line:#e3e3e8; --card:#fafafa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e0e11; --fg:#ececf0; --dim:#9a9aa4; --line:#26262c; --card:#17171b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:48px 16px; background:var(--bg); color:var(--fg);
         font:16px/1.65 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { margin:0 0 4px; font-size:1.6rem; letter-spacing:-.01em; }
  p.sub { margin:0 0 28px; color:var(--dim); }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  a.app { display:block; padding:14px 16px; border:1px solid var(--line); border-radius:10px;
          background:var(--card); color:inherit; text-decoration:none; }
  a.app:hover { border-color:var(--dim); }
  a.app b { display:block; font-weight:600; }
  a.app span { color:var(--dim); font-size:.9rem; }
  .empty { padding:14px 16px; border:1px dashed var(--line); border-radius:10px; color:var(--dim); }
</style>

<main>
  <h1>mini-apps</h1>
  <p class="sub">브라우저에서 바로 돌아가는 작은 앱들.</p>

  <!-- 앱을 하나 지으면 아래에 줄을 더합니다 (README 「새 앱 만들기」)
  <ul>
    <li><a class="app" href="apps/앱이름/"><b>앱이름</b><span>하는 일 한 줄</span></a></li>
  </ul>
  -->
  <div class="empty">아직 앱이 없습니다. <code>apps/_틀/</code> 을 베껴 시작하십시오.</div>
</main>
